<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — proposta de sistema visual</title>
  <!-- Fontes por <link>, somente os pesos usados por cada direção. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400&family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
  <style>
    /* ───────── Chrome do protótipo (fora do sistema avaliado) ───────── */
    :root { --pc-bg: #e4e7ec; --pc-panel: #ffffff; --pc-text: #1d2433; --pc-muted: #5b6475; --pc-line: #cfd4dc; --pc-on: #1d2433; }
    * , *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--pc-bg); color: var(--pc-text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1, h2, h3, p, dl, dd, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    button, input, select, textarea { font: inherit; color: inherit; }

    .pc { position: sticky; top: 0; z-index: 100; background: var(--pc-panel); border-bottom: 1px solid var(--pc-line); padding: 10px 16px; display: grid; gap: 8px; }
    .pc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
    .pc-title { font-weight: 650; font-size: 14px; }
    .pc-title small { font-weight: 400; color: var(--pc-muted); margin-left: 6px; }
    .pc-group { display: flex; align-items: center; gap: 6px; }
    .pc-group > span { color: var(--pc-muted); font-size: 12px; }
    .pc-seg { display: inline-flex; border: 1px solid var(--pc-line); border-radius: 6px; overflow: hidden; }
    .pc-seg button { border: 0; background: none; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
    .pc-seg button + button { border-left: 1px solid var(--pc-line); }
    .pc-seg button[aria-pressed="true"] { background: var(--pc-on); color: #fff; }
    .pc select, .pc .pc-btn { border: 1px solid var(--pc-line); border-radius: 6px; background: #fff; padding: 4px 8px; cursor: pointer; }
    .pc a { color: inherit; }
    .pc :focus-visible { outline: 2px solid #1d2433; outline-offset: 2px; }
    .pc-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 8px 16px; color: var(--pc-muted); font-size: 12px; }
    .pc-notes b { color: var(--pc-text); }
    .pc-kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--pc-line); border-radius: 4px; padding: 0 4px; }

    .stage { padding: 14px 16px 32px; display: grid; gap: 16px; }
    .stage.compare { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .frame-wrap { min-width: 0; display: grid; gap: 6px; }
    .frame-cap { display: flex; justify-content: space-between; gap: 8px; color: var(--pc-muted); font-size: 12px; }
    .frame-cap b { color: var(--pc-text); }
    @media (max-width: 1100px) { .stage.compare { grid-template-columns: 1fr; } }

    /* ───────── Sistema avaliado: tudo consome variáveis da direção ───────── */
    .frame {
      zoom: var(--z, 1);
      height: calc((100vh - var(--pc-h, 150px) - 60px) / var(--z, 1)); min-height: 640px;
      position: relative; overflow: hidden; isolation: isolate;
      display: grid; grid-template-columns: 232px minmax(0, 1fr);
      background: var(--bg); color: var(--fg);
      font-family: var(--font); font-size: 14px; line-height: 20px;
      -webkit-font-smoothing: antialiased; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.12);
    }
    .frame ::selection { background: var(--selection); color: var(--selectionfg); }
    .frame ::-moz-selection { background: var(--selection); color: var(--selectionfg); }
    .frame :focus-visible { outline: var(--focusw) solid var(--focus); outline-offset: 2px; }
    .frame input, .frame textarea { caret-color: var(--focus); }
    .frame .mono { font-family: var(--mono); font-size: 12.5px; }
    .frame .tnum { font-variant-numeric: tabular-nums; }
    .frame .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .frame .ic.sm { width: 14px; height: 14px; }
    .frame .ic.xs { width: 12px; height: 12px; }
    .frame .ic.lg { width: 20px; height: 20px; }
    .frame .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Scrollbar — atual: scrollbar-color laranja (anula ::-webkit-scrollbar no Chromium ≥ 121). */
    .frame[data-dir="current"] * { scrollbar-color: var(--thumb) transparent; }
    /* Propostas: pseudo-elementos WebKit; Firefox recebe scrollbar-color só onde eles não existem. */
    .frame:not([data-dir="current"]) ::-webkit-scrollbar { width: 10px; height: 10px; }
    .frame:not([data-dir="current"]) ::-webkit-scrollbar-track { background: transparent; }
    .frame:not([data-dir="current"]) ::-webkit-scrollbar-thumb { background: var(--thumb); border: 2px solid transparent; background-clip: padding-box; border-radius: 999px; }
    .frame:not([data-dir="current"]) ::-webkit-scrollbar-thumb:hover { background-color: var(--thumbh); }
    @supports not selector(::-webkit-scrollbar) {
      .frame:not([data-dir="current"]) * { scrollbar-color: var(--thumb) transparent; scrollbar-width: thin; }
    }

    /* Sidebar */
    .sb { background: var(--sb); border-right: 1px solid var(--sbb); color: var(--sbfg); display: flex; flex-direction: column; min-height: 0; }
    .sb :focus-visible { outline-color: var(--sbfocus); }
    .sb-brand { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--sbb); }
    .lm { display: none; width: 28px; height: 28px; place-items: center; border-radius: 8px; border: 1px solid #92350a; background: linear-gradient(135deg, #f2520c, #f68d36); color: #fff; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(50,25,10,.14); }
    .frame[data-dir="current"] .lm { display: grid; }
    .frame[data-dir="current"] .wm { display: none; }
    .brand-txt { line-height: 1.15; min-width: 0; }
    .brand-txt strong { display: block; font-size: 14px; font-weight: 600; color: var(--sbselfg); }
    .brand-txt small { display: block; font-size: 12px; color: var(--sbmuted); }
    .wm { font-weight: 800; font-size: 17px; letter-spacing: -.02em; font-style: italic; white-space: nowrap; }
    .wm b { color: var(--logoa); font-weight: inherit; }
    .wm i { color: var(--logob); font-style: inherit; }
    .frame:not([data-dir="current"]) .brand-txt strong { display: none; }
    .nav { flex: 1; overflow: auto; padding: 4px 8px 12px; }
    .nav h3 { padding: 14px 8px 4px; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--sbmuted); }
    .nav ul { display: grid; gap: 1px; }
    .nav a { position: relative; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--rctl); color: var(--sbfg); font-size: 13px; line-height: 18px; font-weight: 500; text-decoration: none; }
    .nav a .ic { width: var(--navicon); height: var(--navicon); color: var(--sbicon); }
    .nav a:hover { background: var(--sbhover); }
    .nav a[aria-current="page"] { background: var(--sbselbg); border-color: var(--sbselb); color: var(--sbselfg); font-weight: 600; }
    .nav a[aria-current="page"] .ic { color: var(--sbselicon); }
    .nav a[aria-current="page"]::before { content: ""; position: absolute; left: var(--markerx); top: 7px; bottom: 7px; width: var(--markerw); border-radius: 0 2px 2px 0; background: var(--sbmarker); }
    .nav .count { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--navcountbg); color: var(--navcountfg); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
    .sb-foot { flex: none; border-top: 1px solid var(--sbb); padding: 8px; display: flex; align-items: center; gap: 6px; }
    .me { flex: 1; min-width: 0; line-height: 1.2; }
    .me strong { display: block; font-size: 13px; font-weight: 600; color: var(--sbselfg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .me small { display: block; font-size: 12px; color: var(--sbmuted); }
    .sb-ib { width: 32px; height: 32px; border: 0; border-radius: var(--rctl); background: none; color: var(--sbmuted); display: grid; place-items: center; cursor: pointer; }
    .sb-ib:hover { background: var(--sbhover); color: var(--sbselfg); }

    .av { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 999px; background: var(--avbg); color: var(--avfg); font-size: 11px; font-weight: 600; }
    .av.sb-av { background: var(--sbavbg); color: var(--sbavfg); }
    .av.sm { width: 20px; height: 20px; font-size: 9px; }
    .av.lg { width: 40px; height: 40px; font-size: 14px; }
    .av.none { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--bstrong); }

    /* Estrutura principal */
    .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .top { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px; border-bottom: 1px solid var(--border); background: var(--topbg); backdrop-filter: var(--topblur); position: relative; z-index: 2; }
    .vdiv { width: 1px; height: 20px; background: var(--border); }
    .crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; line-height: 18px; min-width: 0; }
    .crumbs a { color: var(--muted); text-decoration: none; border-radius: 4px; }
    .crumbs a:hover { color: var(--fg); text-decoration: underline; }
    .crumbs .sep { color: var(--bstrong); }
    .crumbs b { color: var(--fg); font-weight: 500; white-space: nowrap; }
    .scroll { flex: 1; min-height: 0; overflow: auto; }
    .content { padding: var(--contentpad); max-width: 1600px; }
    .back { display: none; align-items: center; gap: 4px; margin-bottom: 8px; padding: 0; border: 0; background: none; color: var(--muted); font-weight: 500; cursor: pointer; }
    .frame[data-dir="current"] .back { display: inline-flex; }

    .ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .ph h1 { font-size: var(--tpage); line-height: var(--tpagel); font-weight: var(--tpagew); letter-spacing: var(--tpagetr); font-variation-settings: var(--tpagevar); }
    .ph p { margin-top: 2px; color: var(--muted); font-size: 13px; line-height: 18px; }
    .ph .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ph .lead-in { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ph-actions { display: flex; gap: 8px; flex: none; }

    /* Botões */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--hctl); padding: 0 12px; border: 1px solid var(--b2b); border-radius: var(--rctl); background: var(--b2bg); color: var(--fg); box-shadow: var(--b2shadow); font-family: var(--font); font-size: 13px; line-height: 18px; font-weight: var(--btnw); white-space: nowrap; cursor: pointer; text-decoration: none; transition: background-color .12s, border-color .12s; }
    .btn:hover, .btn.is-hover { background: var(--b2hbg); border-color: var(--b2hb); }
    .btn:active, .btn.is-active { background: var(--b2abg); }
    .btn.primary { background: var(--primary); border-color: var(--primaryb); color: var(--primaryfg); box-shadow: var(--pshadow); }
    .btn.primary:hover, .btn.primary.is-hover { background: var(--primaryh); border-color: var(--primaryh); }
    .btn.primary:active, .btn.primary.is-active { background: var(--primarya); border-color: var(--primarya); }
    .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ghostfg); }
    .btn.ghost:hover, .btn.ghost.is-hover { background: var(--hover); color: var(--fg); }
    .btn.danger { background: var(--dangerbtn); border-color: var(--dangerbb); color: var(--dangerfg); box-shadow: var(--pshadow); }
    .btn.danger:hover, .btn.danger.is-hover { background: var(--dangerh); border-color: var(--dangerh); }
    .btn.danger-2 { color: var(--danger); }
    .btn.danger-2:hover, .btn.danger-2.is-hover { background: var(--dangersoft); border-color: var(--danger2hb); }
    .btn.sm { height: var(--hsm); padding: 0 10px; }
    .btn.icon { width: var(--hctl); padding: 0; }
    .btn.sm.icon { width: var(--hsm); }
    .btn.is-focus { outline: var(--focusw) solid var(--focus); outline-offset: 2px; }
    .btn[aria-expanded="true"] { background: var(--b2abg); color: var(--fg); }
    .frame:not([data-dir="current"]) .btn:disabled { background: var(--smuted); border-color: var(--border); color: var(--placeholder); box-shadow: none; cursor: not-allowed; }
    .frame[data-dir="current"] .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn.toggle[aria-pressed="true"] { background: var(--sel); border-color: var(--sel); color: var(--selfg); }
    .frame[data-dir="current"] .btn.toggle[aria-pressed="true"] { background: var(--chipbg); border-color: var(--chipb); color: var(--chipfg); }
    .spin { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Campos */
    .field { display: grid; gap: 6px; align-content: start; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field > label, .field > .label { font-size: 13px; line-height: 18px; font-weight: var(--labelw); color: var(--fg); }
    .opt { color: var(--muted); font-weight: 400; }
    .input { width: 100%; min-width: 0; height: var(--hform); padding: 0 10px; border: 1px solid var(--ctl); border-radius: var(--rctl); background: var(--ctlbg); box-shadow: var(--inshadow); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 20px; }
    .input.sm { height: var(--hsm); }
    .input:hover, .input.is-hover { border-color: var(--ctlh); }
    .input:focus, .input.is-focus { outline: none; border-color: var(--focus); box-shadow: var(--fieldfocus); }
    .input::placeholder { color: var(--placeholder); opacity: 1; }
    .input[aria-invalid="true"] { border-color: var(--danger); }
    .input[readonly] { background: var(--robg); border-color: var(--rob); color: var(--rofg); }
    .frame:not([data-dir="current"]) .input:disabled { background: var(--smuted); border-color: var(--border); color: var(--placeholder); cursor: not-allowed; }
    .frame[data-dir="current"] .input:disabled { opacity: .6; cursor: not-allowed; }
    .frame .input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px var(--smuted) inset; -webkit-text-fill-color: var(--fg); }
    textarea.input { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; }
    .select { position: relative; display: flex; min-width: 0; }
    .select select { appearance: none; padding-right: 30px; }
    .select .ic { position: absolute; right: 9px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
    .search { position: relative; display: flex; align-items: center; }
    .search > .ic { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
    .search .input { padding-left: 32px; width: 240px; }
    .hint { color: var(--muted); font-size: 12px; line-height: 16px; }
    .err { display: flex; align-items: flex-start; gap: 6px; color: var(--danger); font-size: 12px; line-height: 16px; font-weight: 500; }
    .err .ic { margin-top: 1px; }
    .frame[data-dir="current"] .err .ic { display: none; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .cb { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13px; line-height: 18px; }
    .cb input { appearance: none; margin: 1px 0 0; flex: none; width: 16px; height: 16px; border: 1px solid var(--ctl); border-radius: var(--rcb); background: var(--ctlbg); display: grid; place-items: center; cursor: pointer; }
    .cb input::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--selfg); border-top: 0; border-right: 0; rotate: -45deg; translate: 0 -1px; opacity: 0; }
    .cb input:checked { background: var(--sel); border-color: var(--sel); }
    .cb input:checked::after { opacity: 1; }
    .cb input:disabled { background: var(--smuted); border-color: var(--border); cursor: not-allowed; }
    .cb:has(input:disabled) { color: var(--placeholder); cursor: not-allowed; }
    .cb input:disabled:checked { background: var(--bstrong); border-color: var(--bstrong); }
    .sw { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
    .sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .sw .track { position: relative; width: 32px; height: 18px; border-radius: 999px; background: var(--switchoff); flex: none; transition: background-color .15s; }
    .sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: translate .15s; }
    .sw input:checked + .track { background: var(--sel); }
    .sw input:checked + .track::after { translate: 14px 0; }
    .sw input:focus-visible + .track { outline: var(--focusw) solid var(--focus); outline-offset: 2px; }
    .chip { height: var(--hsm); padding: 0 10px; border: 1px solid var(--b2b); border-radius: 999px; background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--fg); }
    .chip[aria-pressed="true"] { background: var(--chipbg); border-color: var(--chipb); color: var(--chipfg); }
    .seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--rctl); background: var(--smuted); }
    .seg button { height: calc(var(--hsm) - 6px); padding: 0 10px; border: 0; border-radius: calc(var(--rctl) - 2px); background: none; color: var(--muted); font-family: var(--font); font-size: 13px; font-weight: var(--btnw); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    .seg button:hover { color: var(--fg); }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--segon); }
    .seg .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px; border-radius: var(--rbadge); background: var(--bbg); color: var(--bfg); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; vertical-align: middle; }
    .badge.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bdot, currentColor); }
    .badge .ic { width: 12px; height: 12px; }
    .t-success { --bbg: var(--successsoft); --bfg: var(--success); }
    .t-warning { --bbg: var(--warningsoft); --bfg: var(--warning); }
    .t-info { --bbg: var(--infosoft); --bfg: var(--info); }
    .t-danger { --bbg: var(--dangersoft); --bfg: var(--danger); }
    .t-neutral { --bbg: var(--neutralsoft); --bfg: var(--neutral); }
    .t-attention { --bbg: var(--attbg); --bfg: var(--attfg); --bdot: var(--signal); }
    .tag { --bbg: transparent; --bfg: var(--fgsoft); box-shadow: inset 0 0 0 1px var(--bstrong); }
    .frame[data-dir="c"] .badge:not(.tag) { background: transparent; box-shadow: inset 0 0 0 1px currentColor; }

    /* Painéis e tabelas */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rcard); box-shadow: var(--shcard); }
    .frame[data-dir="c"] .panel { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; box-shadow: none; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .panel-head h2 { font-size: var(--tsec); line-height: var(--tsecl); font-weight: 600; }
    .panel-head p { color: var(--muted); font-size: 12px; line-height: 16px; margin-top: 1px; }
    .panel-body { padding: 16px; }
    .frame[data-dir="c"] .panel-head, .frame[data-dir="c"] .panel-body { padding-left: 0; padding-right: 0; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 12px 8px 16px; }
    .frame[data-dir="c"] .toolbar { padding-left: 0; padding-right: 0; }
    .tw { overflow-x: auto; }
    .tbl { width: 100%; min-width: 720px; border-collapse: separate; border-spacing: 0; }
    .tbl th { height: var(--thh); padding: 0 var(--cellx); text-align: left; white-space: nowrap; font-size: var(--thsize); line-height: 16px; font-weight: var(--thw); color: var(--muted); background: var(--thbg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--thb); }
    .tbl td { height: var(--row); padding: 4px var(--cellx); border-bottom: 1px solid var(--rowb); white-space: nowrap; vertical-align: middle; }
    .tbl th:first-child, .tbl td:first-child { padding-left: 16px; }
    .tbl th:last-child, .tbl td:last-child { padding-right: 12px; }
    .frame[data-dir="c"] .tbl th:first-child, .frame[data-dir="c"] .tbl td:first-child { padding-left: 0; }
    .tbl tbody tr:last-child td { border-bottom: 0; }
    .tbl tbody tr.row:hover td { background: var(--hover); }
    .tbl.compact td { height: var(--rowc); }
    .tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
    .tbl .act { width: 1%; text-align: right; }
    .cm { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cm strong { display: block; font-weight: var(--namew); }
    .cm small { display: block; color: var(--muted); font-size: 12px; line-height: 16px; }
    .mark { display: none; width: 30px; height: 30px; flex: none; place-items: center; border-radius: var(--rctl); background: var(--markbg); color: var(--markfg); box-shadow: inset 0 0 0 1px var(--border); font-size: 11px; font-weight: 700; }

    .toasts { position: absolute; right: 16px; bottom: 16px; display: grid; gap: 8px; }

    function lum(hex) {
      const h = hex.replace("#", ""); if (!/^[0-9a-f]{6}$/i.test(h)) return null;

        <div class="sh-b">
          <div class="field"><label for="${k}-l1">Nome</label><input class="input" id="${k}-l1" value="Patrícia Gomes"></div>
          <div class="field"><label for="${k}-l2">WhatsApp</label><input class="input tnum" id="${k}-l2" value="(21) 9871-220" aria-invalid="true" aria-describedby="${k}-l2e"><p class="err" id="${k}-l2e">${ic("alert", "sm")}Informe o número com DDD e 9 dígitos.</p></div>
          <div class="field"><label for="${k}-l3">E-mail <span class="opt">(opcional)</span></label><input class="input" id="${k}-l3" type="email" placeholder="nome@dominio.com.br"></div>
          <div class="field"><label>Origem</label>${sel("Origem", ["Indicação", "Abordagem", "Campanha"])}</div>
          <div class="field"><label>Responsável</label>${sel("Responsável", ["Ana Souza (você)", "Rafael Nunes", "Sem responsável"])}<p class="hint">A atribuição é registrada no histórico do lead.</p></div>
        </div>
        <div class="sh-f"><button class="btn" type="button" data-cancel>Cancelar</button><button class="btn primary" type="submit">Criar lead</button></div></form>`;
      $(".layer", f).append(s);
      trap(f, s);
      $("input", s).focus();
      $$("[data-cancel]", s).forEach((b) => (b.onclick = () => closeAll(f)));
      s.addEventListener("click", (e) => { if (e.target === s) closeAll(f); });
      $("form", s).onsubmit = (e) => {
        e.preventDefault();
        const b = $('[type="submit"]', s); b.disabled = true; b.style.opacity = 1; b.innerHTML = `<span class="spin"></span>Criando…`;
        setTimeout(() => { closeAll(f); toast(f, "Lead criado."); }, 800);
      };
    }
    function toast(f, msg) {
      const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
      t.innerHTML = `${ic("check-circle")}<span>${msg}</span><button type="button" aria-label="Fechar notificação">${ic("x", "sm")}</button>`;
      $(".toasts", f).append(t);
      $("button", t).onclick = () => t.remove();
      setTimeout(() => t.remove(), 4200);
    }

    /* ═════════ Frames ═════════ */
    function buildFrame(k) {
      const wrap = document.createElement("div"); wrap.className = "frame-wrap";
      wrap.innerHTML = `<div class="frame-cap"><b>${DIRS[k].name}</b><span>${k === "b" ? "recomendada" : k === "current" ? "referência" : "alternativa"}</span></div>`;
      const f = document.createElement("div"); f.className = "frame"; f.dataset.dir = k;
      for (const [key, val] of Object.entries(DIRS[k].vars)) f.style.setProperty("--" + key, val);
      f.innerHTML = shell(k);
      f.addEventListener("click", (e) => {
        if (e.target.closest('a[href="#"]')) e.preventDefault();
        const go = e.target.closest("[data-go]");
        if (go) { e.preventDefault(); set("screen", go.dataset.go); return; }
        const mb = e.target.closest("[data-menu]"); if (mb) { e.stopPropagation(); openMenu(f, mb); return; }
        if (e.target.closest("[data-sheet]")) { openSheet(f); return; }
        if (e.target.closest("[data-confirm-user]")) {
          confirmDialog(f, { title: "Desativar a conta de Rafael Nunes?", body: "A pessoa perde o acesso imediatamente, inclusive em sessões abertas. Históricos, observações e leads atribuídos são preservados.", ok: "Desativar conta", onOk: () => toast(f, "Conta desativada.") });
          return;
        }
        const save = e.target.closest("[data-save]");
        if (save) { save.disabled = true; save.style.opacity = 1; save.innerHTML = `<span class="spin"></span>Salvando…`; setTimeout(() => { save.disabled = false; save.innerHTML = "Salvar alterações"; toast(f, "Alterações salvas."); }, 900); return; }
        const tg = e.target.closest("[data-toggle]"); if (tg) tg.setAttribute("aria-pressed", tg.getAttribute("aria-pressed") !== "true");
        const seg = e.target.closest(".seg button"); if (seg) $$("button", seg.parentElement).forEach((b) => b.setAttribute("aria-pressed", b === seg));
        const chip = e.target.closest(".chip"); if (chip) chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") !== "true");
        if (!e.target.closest(".menu")) $$(".menu:not(.static)", f).forEach(() => closeAll(f));
      });
      f.addEventListener("input", (e) => {
        if (!e.target.matches('.panel input[type="search"]')) return;
        const q = e.target.value.trim().toLowerCase();
        $$("tr.row", f).forEach((r) => (r.hidden = q && !PARTNERS[+r.dataset.i].name.toLowerCase().includes(q)));
      });
      wrap.append(f);
      return wrap;
    }

    function render() {
      const stage = $("#stage");
      const dirs = state.mode === "toggle" ? [state.dir] : [state.left, state.right];
      stage.className = "stage" + (state.mode === "compare" ? " compare" : "");
      const z = state.zoom === "auto" ? (state.mode === "compare" ? (innerWidth >= 2300 ? 1 : innerWidth >= 1100 ? 0.72 : 1) : 1) : +state.zoom;
      stage.replaceChildren(...dirs.map(buildFrame));
      $$(".frame", stage).forEach((f) => f.style.setProperty("--z", z));
      document.documentElement.style.setProperty("--pc-h", $("#pc").offsetHeight + "px");
      $$(".pc-seg").forEach((g) => $$("button", g).forEach((b) => b.setAttribute("aria-pressed", state[g.dataset.set] === b.dataset.v)));
      $("#g-dir").hidden = state.mode !== "toggle";
      $("#g-cmp").hidden = state.mode !== "compare";
      $("#g-list").style.visibility = state.screen === "partners" ? "visible" : "hidden";
      $("#notes").innerHTML = dirs.map((d) => `<p>${DIRS[d].note}</p>`).join("");
    }
    function set(key, val) { state[key] = val; render(); }

    $$(".pc-seg").forEach((g) => g.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) set(g.dataset.set, b.dataset.v); }));
    $$("[data-sel]").forEach((s) => {
      if (s.dataset.sel !== "zoom") s.innerHTML = ORDER.map((d) => `<option value="${d}">${DIRS[d].name}</option>`).join("");
      s.value = state[s.dataset.sel];
      s.addEventListener("change", () => set(s.dataset.sel, s.value));
    });
    $$("[data-open]").forEach((b) => b.addEventListener("click", () => {
      const what = b.dataset.open;
      if (what === "menu" || what === "confirm") { if (state.screen !== "partners" || state.list !== "normal") { state.screen = "partners"; state.list = "normal"; render(); } }
      if (what === "sheet" && state.screen !== "leads") { state.screen = "leads"; render(); }
      $$(".frame").forEach((f) => {
        if (what === "menu") openMenu(f, $("[data-menu]", f));
        if (what === "confirm") confirmDeactivate(f, PARTNERS[3], $('tr[data-i="3"]', f));
        if (what === "sheet") openSheet(f);
        if (what === "toast") toast(f, "Alterações salvas.");
      });
    }));
    document.addEventListener("keydown", (e) => {
      if (state.mode !== "toggle" || e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
      const i = ["1", "2", "3", "4"].indexOf(e.key); if (i >= 0) set("dir", ORDER[i]);
    });
    addEventListener("resize", () => { if (state.mode === "compare" && state.zoom === "auto") render(); });
    /* Estado inicial pelo hash (#dir=a&screen=leads), para compartilhar uma vista. */
    const hash = new URLSearchParams(location.hash.slice(1));
    for (const [key, val] of hash) if (key in state) state[key] = val;
    render();
    if (hash.get("open")) $(`[data-open="${hash.get("open")}"]`)?.click();
  </script>
</body>
</html>
