    const sRows = P ? sAll.filter((r) => (!st.stab || String(r.active) === st.stab) && (!st.sq || r.name.toLowerCase().includes(st.sq.toLowerCase()))) : sAll;
    const pRows = PLAN_ROWS.filter((r) => (!st.ptab || String(r.active) === st.ptab) && (!st.pq || r.name.toLowerCase().includes(st.pq.toLowerCase())));
    const seg = (key, tabs, all, stateOf) => `<div class="seg" role="group" aria-label="Filtrar por estado">${tabs.map(([v, l]) => `<button type="button" data-a="tab" data-key="${key}" data-v="${v}" aria-pressed="${(st[key] || "") === v}"><span>${l}</span><span class="count">${all.filter((r) => !v || stateOf(r) === v).length}</span></button>`).join("")}</div>`;
    const emptyRow = (cols, msg, key) => `<tr class="empty-row"><td colspan="${cols}"><strong>${msg}</strong>Ajuste a busca ou o filtro de estado.${P ? `<br><button class="btn sm" type="button" data-a="clear" data-key="${key}" style="margin-top:10px">Limpar filtros</button>` : ""}</td></tr>`;
    const srcActions = (r) => {
      if (r.protected) return "";
      if (!P) return `<button class="btn sm" type="button" data-a="edit" data-name="${r.name}">Editar</button><button class="btn ghost sm" type="button">${r.active ? "Desativar" : "Reativar"}</button>`;
      return `<button class="btn sm" type="button" data-a="edit" data-name="${r.name}">Editar</button><button class="btn ghost sm icon-only" type="button" data-a="menu" data-menu="src:${r.name}" aria-label="Mais ações para ${r.name}" aria-haspopup="menu">${ic("i-more")}</button>`;
    };
    const srcCard = `<div class="card"><div class="toolbar"><div class="toolbar-start">${P ? seg("stab", [["", "Todas"], ["true", "Ativas"], ["false", "Inativas"]], sAll, (r) => String(r.active)) : '<div class="seg" role="group" aria-label="Filtrar por estado" style="min-width:12px;min-height:32px"></div>'}</div>
      <div class="toolbar-end"><div class="search-box">${ic("i-search")}<input class="control" type="search" placeholder="Filtrar origens" aria-label="Filtrar origens" data-in="sq" value="${esc(st.sq)}"></div></div></div>
      ${!P && (st.typed || st.sq) ? anno("bad", "A busca não filtra: o campo está ligado a uma função vazia. As abas de estado também não existem (grupo vazio à esquerda).") : ""}
      <div class="table-wrap"><table class="table"><thead><tr><th scope="col">Origem</th><th scope="col" class="r">Leads</th><th scope="col">Estado</th><th scope="col" class="actions"><span class="sr-only">Ações</span></th></tr></thead><tbody>
      ${sRows.length ? sRows.map((r) => `<tr class="${P && !r.protected ? "clickable" : ""}" ${P && !r.protected ? `data-row="edit" data-name="${r.name}"` : ""}><td><div class="cell-main"><div><strong>${r.name}${r.protected ? ` <span class="badge tag" style="margin-left:6px">${ic("i-lock")}Protegida</span>` : ""}</strong>${r.protected ? "<small>Automática, usada pelo catálogo</small>" : ""}</div></div></td><td class="r num">${r.leads}</td><td>${r.active ? badge("success", "Ativa") : badge("", "Inativa")}</td><td class="actions"><div>${srcActions(r)}</div></td></tr>`).join("") : emptyRow(4, "Nenhuma origem encontrada com esses filtros.", "src")}
      </tbody></table></div><div class="card-foot"><span class="num">${sRows.length === sAll.length ? plural(sAll.length, "origem", "origens") : `${sRows.length} de ${sAll.length} origens`}</span>${P ? "" : "<span>Ordem alfabética · sem paginação</span>"}</div></div>`;
    const planCard = `<div class="page-head" style="margin-top:28px"><div><h1>Planos</h1><p>Mesmo padrão de linha aplicado a Planos, Categorias, Parceiros e Usuários.</p></div></div>
      <div class="card"><div class="toolbar"><div class="toolbar-start">${seg("ptab", [["", "Todos"], ["true", "Ativos"], ["false", "Inativos"]], PLAN_ROWS, (r) => String(r.active))}</div><div class="toolbar-end"><div class="search-box">${ic("i-search")}<input class="control" type="search" placeholder="Filtrar planos" aria-label="Filtrar planos" data-in="pq" value="${esc(st.pq)}"></div></div></div>
      <div class="table-wrap"><table class="table"><thead><tr><th scope="col">Plano</th><th scope="col">Identificador público</th><th scope="col">Estado</th><th scope="col" class="actions"><span class="sr-only">Ações</span></th></tr></thead><tbody>
      ${pRows.length ? pRows.map((r) => `<tr class="${P ? "clickable" : ""}" ${P ? `data-row="edit" data-name="${r.name}"` : ""}><td><div class="cell-main"><span class="mark">${initials(r.name)}</span><div><strong>${r.name}</strong></div></div></td><td><span class="mono muted">${r.slug}</span></td><td>${r.active ? badge("success", "Ativo") : badge("", "Inativo")}</td>
        <td class="actions"><div><button class="btn sm" type="button" data-a="edit" data-name="${r.name}">Editar</button><button class="btn ghost sm icon-only" type="button" data-a="menu" data-menu="plan:${r.name}" aria-label="Mais ações para ${r.name}" aria-haspopup="menu">${ic("i-more")}</button></div></td></tr>`).join("") : emptyRow(4, "Nenhum plano encontrado com esses filtros.", "plan")}
      </tbody></table></div><div class="card-foot"><span class="num">${pRows.length === PLAN_ROWS.length ? plural(PLAN_ROWS.length, "plano", "planos") : `${pRows.length} de ${PLAN_ROWS.length} planos`}</span>${P ? "" : "<span>Ordem alfabética · sem paginação</span>"}</div></div>`;
    const pageErr = !P && st.err ? `<div class="alert danger" role="alert" style="margin-bottom:12px">${ic("i-alert")}<div><strong>Não foi possível concluir a operação.</strong>Não foi possível concluir a operação. Tente novamente.</div></div>` : "";
    const body = `${pageErr}<div class="page-head"><div><h1>Origens</h1><p>Canais de aquisição atribuídos aos leads.</p></div><div class="page-actions"><button class="btn primary" type="button" data-a="new">${ic("i-plus")}Nova origem</button></div></div>${srcCard}${planCard}`;
    let menu = "";
    if (st.menu) {
      const [kind, name] = st.menu.split(":");
      let items;
      if (kind === "plan") {
        const r = PLAN_ROWS.find((x) => x.name === name);
        items = P ? [{ l: r.active ? "Desativar" : "Reativar", d: r.active }] : [{ l: "Editar" }, "sep", { l: r.active ? "Desativar" : "Reativar", d: r.active }];
      } else {
        const r = SRC_ROWS.find((x) => x.name === name);
        items = [{ l: r.active ? "Desativar" : "Reativar", d: false }, ...(r.leads === 0 ? ["sep", { l: "Excluir", d: true }] : [])];
      }
      menu = `<div class="menu" role="menu" style="top:${st.menuY}px;left:${st.menuX}px">${items.map((it) => it === "sep" ? "<hr>" : `<button type="button" role="menuitem" class="${it.d ? "danger" : ""}" data-a="menu-close">${it.l}</button>`).join("")}</div>`;
      if (!P && kind === "plan") menu += `<div style="position:absolute;top:${st.menuY + 8}px;left:${Math.max(8, st.menuX - 230)}px;width:220px">${anno("bad", "“Editar” repete o botão ao lado.")}</div>`;
    }
    let drawer = "";
    if (st.drawer) {
      const nameField = P && st.err ? field({ id: "src-n-" + f.v, label: "Nome", value: st.drawer.name, error: "Já existe um registro com este nome.", attrs: 'data-in="dname"' }) : field({ id: "src-n-" + f.v, label: "Nome", value: st.drawer.name, hint: "Deve ser único, sem diferenciar maiúsculas e acentos.", attrs: 'data-in="dname"' });
      drawer = `<div class="f-overlay" data-a="close"></div><div class="f-drawer" role="dialog" aria-modal="true" aria-labelledby="sd-${f.v}"><div class="dlg-head"><div><h2 id="sd-${f.v}">${st.drawer.title}</h2><p>Canal usado para identificar como o lead chegou.</p></div><button class="btn ghost sm icon-only" type="button" data-a="close" aria-label="Fechar">${ic("i-x")}</button></div>
        <div class="dlg-body">${!P && st.err ? anno("bad", "O erro foi exibido na página, atrás deste dialog. Aqui nada indica que o salvamento falhou; o botão parece não funcionar.") : ""}${nameField}<label class="check"><input type="checkbox"><span><strong style="font-weight:600">Origem por indicação</strong><span class="hint" style="display:block">Exige informar quem indicou no cadastro do lead.</span></span></label></div>
        <div class="dlg-actions"><button class="btn" type="button" data-a="close">Cancelar</button><button class="btn primary${P && st.saving ? " loading" : ""}" type="button" data-a="save">Salvar</button></div></div>`;
    }
    return shell(f, { nav: "sources", crumbs: [["Comercial"], ["Origens"]], url: P && (st.sq || st.stab) ? `/origens<b>?${st.stab ? "estado=" + (st.stab === "true" ? "ativas" : "inativas") : ""}${st.stab && st.sq ? "&" : ""}${st.sq ? "busca=" + esc(st.sq) : ""}</b>` : "/origens", body }) + menu + drawer + toastsHtml(f);
  },
  act(f, a, el) {
    const st = f.st, P = f.v === "proposed";
    if (a === "tab") st[el.dataset.key] = el.dataset.v;
    if (a === "clear") { if (el.dataset.key === "src") { st.sq = ""; st.stab = ""; } else { st.pq = ""; st.ptab = ""; } }
    if (a === "edit") { st.drawer = { title: el.dataset.name ? "Editar" : "Nova origem", name: el.dataset.name || "" }; st.err = false; st.menu = null; }
    if (a === "new") { st.drawer = { title: "Nova origem", name: "" }; st.err = false; }
    if (a === "close") { st.drawer = null; if (!P) st.err = false; }
    if (a === "save") {
      const dup = SRC_ROWS.some((r) => r.name.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "") === (st.drawer.name || "").toLowerCase().normalize("NFD").replace(/\p{M}/gu, ""));
      if (P) { st.saving = true; later(f, () => { st.saving = false; if (dup) st.err = true; else { st.drawer = null; toast(f, "Origem salva."); } }, 500); }
      else if (dup) st.err = true; else st.drawer = null;
    }
    if (a === "menu") {
      const key = el.dataset.menu; if (st.menu === key) { st.menu = null; return; }
      const fr = f.el.getBoundingClientRect(), r = el.getBoundingClientRect();
      st.menu = key; st.menuY = r.bottom - fr.top + 4; st.menuX = Math.max(8, r.right - fr.left - 196);
    }
    if (a === "menu-close") st.menu = null;
  },
  row(f, el) { this.act(f, "edit", el); },
  input(f, name, value) {
    if (name === "sq" && f.v === "current") { f.st.typed = true; f.st.sq = value; return "keep-noop"; }
    if (name === "dname") { f.st.drawer.name = value; f.st.err = f.v === "current" ? f.st.err : false; return "keep"; }
    f.st[name] = value;
  },
};

const auditFlow = {
  title: "Auditoria — filtros",
  states: [["default", "Padrão"], ["loading", "Carregando filtro"], ["empty", "Vazio"]],
  cost: ["3 filtros: 3 trocas de tela pelo esqueleto · foco perdido · filtros perdidos ao sair", "3 filtros: tabela esmaecida no lugar · foco mantido · filtros na URL"],
  notes: {
    current: [["A1", "Cada filtro ou página substitui barra, tabela e paginação pelo esqueleto; o foco sai do seletor."], ["A3", "“Limpar filtros” sempre visível."], ["A2", "Filtros perdidos ao navegar."]],
    proposed: [["A1", "A barra permanece; a tabela anterior fica esmaecida com indicador até a nova página chegar."], ["A3", "“Limpar filtros” só quando algo difere do padrão; também no vazio."], ["A2", "Filtros e página na URL."]],
  },
  init(state) {
    const st = { action: "", author: "", target: "", loading: false, sticky: false };
    if (state === "loading") { st.action = "Permissão concedida"; st.loading = true; st.sticky = true; }
    if (state === "empty") { st.action = "Conta desativada"; st.author = "Rafael Nunes"; }
    return st;
  },
  render(f) {
    const st = f.st, P = f.v === "proposed";
    const rows = AUDIT.filter((a) => (!st.action || a.action === st.action) && (!st.author || a.author === st.author) && (!st.target || a.target === st.target));
    const any = st.action || st.author || st.target;
    const sel = (name, label, values) => `<select class="control" data-in="${name}" aria-label="${label}" id="aud-${name}-${f.v}"><option value="">${label === "Ação" ? "Todas as ações" : label === "Autor" ? "Todos os autores" : "Todos os afetados"}</option>${values.map((v) => `<option ${st[name] === v ? "selected" : ""}>${v}</option>`).join("")}</select>`;
    const head = `<div class="page-head"><div><h1>Auditoria</h1><p>Registro imutável de operações administrativas sensíveis.</p></div></div>`;
    if (!P && st.loading) {
      const sk = `<div class="card" role="status" aria-label="Carregando eventos"><div style="height:48px;border-bottom:1px solid var(--border)"></div><div style="height:36px;border-bottom:1px solid var(--border-strong)"></div><div class="card-body" style="padding-top:4px;padding-bottom:4px">${Array.from({ length: 6 }, () => '<div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>').join("")}</div></div>`;
      return shell(f, { nav: "audit", crumbs: [["Administração"], ["Auditoria"]], url: "/auditoria", body: head + anno("bad", "A troca de filtro desmontou a barra, a tabela e a paginação. O seletor usado perdeu o foco.") + sk });
    }
    const q = [st.action && "acao=" + encodeURIComponent(st.action.toLowerCase()), st.author && "autor=" + first(st.author).toLowerCase(), st.target && "afetado=" + first(st.target).toLowerCase()].filter(Boolean).join("&");
    const body = `${head}<div class="card"><div class="toolbar"><div class="toolbar-start"><select class="control" aria-label="Período"><option>Últimos 30 dias</option><option>Últimos 7 dias</option><option>Hoje</option><option>Todo o período</option></select>
      ${sel("action", "Ação", [...new Set(AUDIT.map((a) => a.action))].sort())}${sel("author", "Autor", [...new Set(AUDIT.map((a) => a.author))])}${sel("target", "Usuário afetado", [...new Set(AUDIT.map((a) => a.target))])}</div>
      <div class="toolbar-end">${!P || any ? `<button class="btn ghost sm" type="button" data-a="clear">Limpar filtros</button>` : ""}</div></div>
      ${P && st.loading ? '<div class="table-progress" role="progressbar" aria-label="Atualizando eventos"></div>' : ""}
      <div class="table-wrap"><table class="table"><thead><tr><th scope="col">Data e hora</th><th scope="col">Ação</th><th scope="col">Autor</th><th scope="col">Afetado</th><th scope="col">Objeto</th></tr></thead>
      <tbody class="${P && st.loading ? "refreshing" : ""}" ${P && st.loading ? 'aria-busy="true"' : ""}>${rows.length ? rows.map((a) => `<tr class="clickable"><td><span class="num muted">${a.at}</span></td><td><strong style="font-weight:600">${a.action}</strong></td><td><span class="cell-main" style="gap:8px"><span class="avatar sm">${initials(a.author)}</span>${a.author}</span></td><td><span class="cell-main" style="gap:8px"><span class="avatar sm">${initials(a.target)}</span>${a.target}</span></td><td><span class="muted">${a.object}</span></td></tr>`).join("")
        : `<tr class="empty-row"><td colspan="5"><strong>Nenhum evento com esses filtros.</strong>Amplie o período ou remova filtros.${P ? '<br><button class="btn sm" type="button" data-a="clear" style="margin-top:10px">Limpar filtros</button>' : ""}</td></tr>`}</tbody></table></div>
      <div class="card-foot"><span class="num" aria-live="polite">${P && st.loading ? "Atualizando…" : rows.length ? `1–${rows.length} de ${rows.length} eventos` : "0 eventos"}</span><div class="pager"><button class="btn sm" type="button" disabled aria-label="Página anterior">${ic("i-left")}</button><span class="num">Página 1 de 1</span><button class="btn sm" type="button" disabled aria-label="Próxima página">${ic("i-right")}</button></div></div></div>`;
    return shell(f, { nav: "audit", crumbs: [["Administração"], ["Auditoria"]], url: P && q ? `/auditoria<b>?${esc(q)}</b>` : "/auditoria", body });
  },
  act(f, a) { if (a === "clear") { Object.assign(f.st, { action: "", author: "", target: "" }); this.load(f); } },
  input(f, name, value) { f.st[name] = value; this.load(f); if (f.v === "current") return "blur"; },
  load(f) { const st = f.st; st.loading = true; st.sticky = false; setTimeout(() => { if (!st.sticky) { st.loading = false; renderFrame(f); } }, 900); },

/* ═════════ Orquestração ═════════ */
const FLOWS = { leads: leadsFlow, lead: leadDetailFlow, "new-lead": newLeadFlow, partner: partnerFlow, user: userFlow, lists: listsFlow, audit: auditFlow };
const view = { flow: "leads", v: "proposed", state: "default" };
let frames = [];

function parseHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (FLOWS[p.get("flow")]) view.flow = p.get("flow");
  if (["current", "proposed", "compare"].includes(p.get("v"))) view.v = p.get("v");
  const states = FLOWS[view.flow].states.map((s) => s[0]);
  view.state = states.includes(p.get("state")) ? p.get("state") : states[0];
}
function writeHash() { history.replaceState(null, "", `#flow=${view.flow}&v=${view.v}&state=${view.state}`); }

function renderChrome() {
  const flow = FLOWS[view.flow];
  $("#flow-tabs").innerHTML = Object.entries(FLOWS).map(([id, fl]) => `<button type="button" data-flow="${id}" aria-pressed="${id === view.flow}">${fl.title}</button>`).join("");
  $("#state-tabs").innerHTML = `<span>Estado</span>${flow.states.map(([id, l]) => `<button class="btn sm toggle" type="button" data-state="${id}" aria-pressed="${id === view.state}">${l}</button>`).join("")}`;
  $$("#version-seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === view.v));
  const col = (kind, title, items, cost) => `<div class="note-col ${kind}"><h2>${title}<span>${cost}</span></h2><ul>${items.map(([id, t]) => `<li><b>${id}</b><span>${esc(t).replace(/`([^`]+)`/g, "<code>$1</code>")}</span></li>`).join("")}</ul></div>`;
  $("#notes").innerHTML = col("cur", "Atual — atritos", flow.notes.current, flow.cost[0]) + col("pro", "Proposta — mudanças", flow.notes.proposed, flow.cost[1]);
}

function renderStage() {
  const stage = $("#stage"), flow = FLOWS[view.flow];
  stage.className = "stage-wrap" + (view.v === "compare" ? " compare" : "");
  const versions = view.v === "compare" ? ["current", "proposed"] : [view.v];
  stage.innerHTML = versions.map((v) => `<section class="frame" data-v="${v}" aria-label="${v === "current" ? "Versão atual" : "Versão proposta"}"><span class="frame-label">${v === "current" ? "Atual" : "Proposta"}</span><div class="frame-body"></div></section>`).join("");
  frames = versions.map((v, i) => ({ v, el: $$(".frame", stage)[i], flow, st: flow.init(view.state) }));
  frames.forEach(renderFrame);
}

function renderFrame(f) {
  if (!f.el.isConnected) return;
  const active = document.activeElement, keep = f.el.contains(active) && active.dataset?.in ? { sel: active.id ? `#${CSS.escape(active.id)}` : `[data-in="${active.dataset.in}"]${active.dataset.plan ? `[data-plan="${active.dataset.plan}"]` : ""}`, s: active.selectionStart, e: active.selectionEnd } : null;
  $(".frame-body", f.el).innerHTML = f.flow.render(f);
  const target = f.focusSel ? $(f.focusSel, f.el) : keep && !f.blur ? $(keep.sel, f.el) : null;
  if (target) { target.focus({ preventScroll: true }); if (!f.focusSel && keep && typeof keep.s === "number" && target.setSelectionRange) { try { target.setSelectionRange(keep.s, keep.e); } catch { /* campos sem seleção */ } } }
  f.focusSel = null; f.blur = false;
  if (f.scrollTop) { f.scrollTop = false; const y = f.el.getBoundingClientRect().top + scrollY - 140; if (scrollY > y) scrollTo({ top: y }); }
  if (typeof f.restoreY === "number") { const y = f.restoreY; f.restoreY = null; requestAnimationFrame(() => scrollTo({ top: y })); }
}

const frameOf = (el) => frames.find((f) => f.el.contains(el));
document.addEventListener("click", (e) => {
  const fl = e.target.closest("[data-flow]"); if (fl) { view.flow = fl.dataset.flow; view.state = FLOWS[view.flow].states[0][0]; return go(); }
  const sb = e.target.closest("[data-state]"); if (sb) { view.state = sb.dataset.state; return go(); }
  const vb = e.target.closest("#version-seg [data-v]"); if (vb) { view.v = vb.dataset.v; return go(); }
  const f = frameOf(e.target); if (!f) return;
  const act = e.target.closest("[data-a]");
  if (act && f.el.contains(act)) { e.preventDefault(); if (act.dataset.a !== "noop") f.flow.act(f, act.dataset.a, act); return renderFrame(f); }
  const row = e.target.closest("[data-row]");
  if (row && f.flow.row && !e.target.closest("button, a, input, select, textarea")) { f.flow.row(f, row); return renderFrame(f); }
  if (f.st.menu && !e.target.closest(".menu")) { f.st.menu = null; renderFrame(f); }
});
document.addEventListener("submit", (e) => {
  const f = frameOf(e.target); if (!f) return;
  e.preventDefault(); f.flow.act(f, e.target.dataset.form, e.target); renderFrame(f);
});
const onInput = (e) => {
  const el = e.target.closest("[data-in]"); const f = el && frameOf(el); if (!f) return;
  const isText = (el.tagName === "INPUT" && !["checkbox", "radio"].includes(el.type)) || el.tagName === "TEXTAREA";
  if (e.type === "change" && isText) return;
  if (e.type === "input" && !isText) return;
  const r = f.flow.input(f, el.dataset.in, el.value, el);
  if (r === "keep-noop") return renderFrame(f);
  if (r === "keep" && isText) return;
  if (r === "blur") f.blur = true;
  renderFrame(f);
};
document.addEventListener("input", onInput);
document.addEventListener("change", onInput);
document.addEventListener("keydown", (e) => {
  if (e.target.closest?.("input, textarea, select")) return;
  const map = { 1: "current", 2: "proposed", 3: "compare" };
  if (map[e.key]) { view.v = map[e.key]; go(); }
  if (e.key === "Escape") frames.forEach((f) => { if (f.st.dialog || f.st.sheet || f.st.drawer || f.st.menu || f.st.leaving || f.st.open) { f.st.dialog = null; f.st.sheet = false; f.st.drawer = null; f.st.menu = null; f.st.leaving = false; if (f.st.open !== undefined) f.st.open = false; renderFrame(f); } });
});
$("#reset-flow").addEventListener("click", () => renderStage());
function go() { writeHash(); renderChrome(); renderStage(); }
