    .pane:not(.theme-current)::-webkit-scrollbar-thumb:hover, .pane:not(.theme-current) .scroll-demo::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); }
    @supports not selector(::-webkit-scrollbar) {
      .pane:not(.theme-current), .pane:not(.theme-current) .scroll-demo { scrollbar-color: var(--sb-thumb) var(--sb-track); }
    }

    /* ═════════ Componentes (consomem só papéis semânticos) ═════════ */
    .pane { --gutter: 16px; container: pane / inline-size; overflow: auto; min-height: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    .pane-inner { --gutter: 16px; }
    @container pane (min-width: 700px) { .pane-inner { --gutter: 32px; } }
    :where(.pane) :where(h1, h2, h3, p, ul, dl, dd) { margin: 0; }
    :where(.pane) :where(ul) { padding: 0; list-style: none; }
    :where(.pane) :where(button, input, select) { font: inherit; color: inherit; }
    :where(.pane) :where(a) { color: inherit; }
    .pane :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .pane .on-dark :focus-visible { outline-color: var(--focus-dark); }
    .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .icon.sm { width: 16px; height: 16px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter); }
    .eyebrow { font-family: var(--font-display); font-size: 13px; font-weight: var(--eyebrow-weight); font-stretch: var(--eyebrow-stretch); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-fg); }
    .h2 { font-family: var(--font-display); font-size: var(--h2-size); font-weight: var(--h2-weight); font-stretch: var(--h2-stretch); letter-spacing: var(--h2-track); line-height: 1.04; margin-top: 10px; }
    .h3 { font-family: var(--font-display); font-size: var(--h3-size); font-weight: var(--h3-weight); font-stretch: var(--h3-stretch); line-height: 1.2; letter-spacing: -.01em; }
    .section { padding: 56px 0; }
    .soft { color: var(--fg-soft); }
    .muted { color: var(--fg-muted); }

    /* Botões */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: var(--r-button); border: 1.5px solid transparent; font-family: var(--font-body); font-weight: var(--btn-weight); font-size: 16px; line-height: 1.2; letter-spacing: .005em; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background-color .12s cubic-bezier(.2,.7,.2,1), box-shadow .12s, transform .12s, border-color .12s; }
    .btn.sm { min-height: 44px; padding: 0 16px; font-size: 15px; }
    .btn.primary { background: var(--primary); color: var(--primary-fg); box-shadow: var(--sh-brand); }
    .btn.primary:hover, .btn.primary.is-hover { background: var(--primary-hover); }
    .btn.primary:active, .btn.primary.is-active { background: var(--primary-active); box-shadow: var(--sh-brand-pressed); transform: translateY(1px); }
    .btn.secondary { background: var(--secondary-bg); color: var(--secondary-fg); border-color: var(--secondary-border); box-shadow: var(--sh-soft); }
    .btn.secondary:hover, .btn.secondary.is-hover { background: var(--secondary-hover); }
    .btn.secondary:active, .btn.secondary.is-active { transform: translateY(1px); box-shadow: none; }
    .btn.ghost { background: transparent; color: var(--fg); min-height: 44px; padding: 0 14px; }
    .btn.ghost:hover, .btn.ghost.is-hover { background: var(--nav-hover); }
    .btn.danger { background: #b4233a; color: #ffffff; }
    .btn.danger:hover, .btn.danger.is-hover { background: #9c1c31; }
    .btn.is-focus { outline: 3px solid var(--focus); outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; transform: none; box-shadow: none; background: var(--primary-disabled-bg); color: var(--primary-disabled-fg); border-color: var(--border); }
    .theme-current .btn:disabled { opacity: .5; background: var(--primary); color: var(--primary-fg); border-color: transparent; }
    .theme-current .btn.secondary:disabled { background: transparent; color: var(--secondary-fg); border-color: var(--secondary-border); }
    .btn.loading { position: relative; color: transparent !important; pointer-events: none; }
    .btn.loading::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--primary-fg); border-right-color: transparent; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .link { color: var(--link-fg); font-weight: 600; text-decoration: underline; text-decoration-color: var(--link-underline); text-decoration-thickness: 2px; text-underline-offset: 4px; display: inline-flex; align-items: center; gap: 4px; }

    /* Header */
    .site-header { position: sticky; top: 0; z-index: 5; background: var(--header-bg); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--header-line); color: var(--header-fg); }
    .site-header .wrap { display: flex; align-items: center; gap: 12px; height: 68px; }
    .logo { display: inline-flex; align-items: center; font-family: var(--font-display); font-weight: 750; font-stretch: var(--h2-stretch); font-size: 24px; letter-spacing: -.02em; color: var(--logo-fg); text-decoration: none; min-height: 44px; }
    .logo span { color: var(--logo-plus); }
    .logo-note { font: 600 10px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: inherit; opacity: .7; border: 1px dashed currentColor; border-radius: 4px; padding: 3px 5px; margin-left: 8px; }
    .main-nav { margin-left: auto; display: none; gap: 2px; }
    .main-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: var(--r-nav); font-size: 15px; font-weight: var(--nav-weight); text-decoration: none; color: var(--header-fg); }
    .main-nav a:hover { background: var(--nav-hover); }
    .header-cta { margin-left: auto; }
    @container pane (min-width: 820px) { .main-nav { display: flex; } .header-cta { margin-left: 8px; } }

    /* Hero */
    .hero { background: var(--hero-bg); color: var(--hero-fg); padding: 40px 0 56px; overflow: hidden; }
    .hero .wrap { display: grid; gap: 40px; align-items: center; }
    @container pane (min-width: 1040px) { .hero { padding: 64px 0 80px; } .hero .wrap { grid-template-columns: 1.2fr .8fr; gap: 48px; } }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--badge-bg); border: 1px solid var(--badge-border); color: var(--badge-fg); font-size: 14px; font-weight: 500; }
    .badge i { width: var(--badge-dot-size); height: var(--badge-dot-size); margin-left: 4px; border-radius: 50%; background: var(--badge-dot); display: grid; place-items: center; color: #fff; }
    .theme-current .badge i { margin-left: 0; }
    .badge i svg { width: 14px; height: 14px; }
    .pane:not(.theme-current) .badge i svg { display: none; }
    .hero h1 { margin-top: 20px; font-family: var(--font-display); font-size: var(--hero-size); font-weight: var(--hero-weight); font-stretch: var(--hero-stretch); letter-spacing: var(--hero-track); line-height: var(--hero-lh); text-wrap: balance; }
    .hero h1 em { font-style: normal; color: var(--hero-em); }
    .hero .lead { margin-top: 20px; font-size: var(--lead-size); color: var(--hero-fg-soft); max-width: 34em; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .theme-b .hero .btn.secondary { background: transparent; color: #ffffff; border-color: #7a879e; box-shadow: none; }
    .theme-b .hero .btn.secondary:hover { background: #18284a; }
    .hero-art { position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: 460px; justify-self: center; }
    .art-blobs, .art-stage { position: absolute; inset: 0; }
    .theme-current .art-stage, .pane:not(.theme-current) .art-blobs { display: none; }
    .blob { position: absolute; border-radius: 50%; }
    .blob.a { inset: 6% 10% 14% 4%; background: var(--inverse); border-radius: 46% 54% 42% 58% / 52% 44% 56% 48%; }
    .blob.b { width: 38%; aspect-ratio: 1; right: 2%; top: 2%; background: var(--signal); }
    .blob.c { width: 22%; aspect-ratio: 1; left: 0; bottom: 6%; background: var(--border); }
    .float-card { position: absolute; background: var(--card-bg); color: var(--fg); border-radius: 16px; box-shadow: var(--sh-float); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    .pane:not(.theme-current) .float-card { background: var(--surface); box-shadow: var(--sh-card); border: 1px solid var(--border); }
    .float-card small { display: block; font-size: 13px; color: var(--fg-muted); }
    .float-card strong { display: block; font-family: var(--font-display); font-size: 26px; font-weight: var(--num-weight); font-stretch: var(--num-stretch); letter-spacing: -.02em; line-height: 1; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
    .float-card b { display: block; font-size: 15px; }
    .dot-tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--icon-tile-bg); color: var(--icon-tile-fg); }
    .art-blobs .one { left: 12%; top: 22%; } .art-blobs .two { right: 4%; bottom: 22%; } .art-blobs .three { left: 22%; bottom: 4%; }
    .stage-bg { position: absolute; inset: 4% 0 8% 6%; border-radius: var(--r-panel); background: var(--stage-bg); overflow: hidden; }
    .theme-a .stage-bg { border: 1px solid #dce2ec; }
    .stage-orb { position: absolute; width: 30%; aspect-ratio: 1; border-radius: 50%; right: 4%; top: 0; background: var(--signal); }
    .theme-b .stage-bg { background: radial-gradient(circle at 60% 40%, #18284a 0%, transparent 65%); }
    .theme-c .stage-bg { inset: 2%; border-radius: 50%; }
    .theme-c .stage-orb { width: 18%; right: 6%; top: 6%; }
    .art-stage .flexcard { position: absolute; left: 14%; top: 26%; width: 72%; transform: rotate(-7deg); animation: hover-card 8s ease-in-out infinite; }
    @keyframes hover-card { 50% { transform: rotate(-7deg) translateY(-8px); } }
    .art-stage .one { left: 0; top: 10%; } .art-stage .two { right: 0; bottom: 6%; }

    /* Flex Card (representação ilustrativa) */
    .flexcard { aspect-ratio: 85.6 / 54; border-radius: var(--r-sig); background: linear-gradient(135deg, #0b2350 0%, #04173a 55%, #031230 100%); color: #ffffff; box-shadow: var(--sh-sig); position: relative; overflow: hidden; padding: 6% 7%; display: flex; flex-direction: column; justify-content: space-between; container-type: inline-size; }
    .flexcard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, 0) 38%); pointer-events: none; }
    .flexcard::after { content: ""; position: absolute; right: -6%; bottom: -10%; width: 46%; height: 70%; background: repeating-linear-gradient(-55deg, #fd5200 0 7%, transparent 7% 12%); clip-path: polygon(30% 100%, 100% 0, 100% 100%); opacity: .95; }
    .flexcard.light { background: linear-gradient(135deg, #ffffff 0%, #eef2f7 60%, #dce2ec 100%); color: #04173a; }
    .flexcard.light::before { background: linear-gradient(115deg, rgba(255, 255, 255, .7) 0%, rgba(255, 255, 255, 0) 40%); }
    .flexcard.light .fc-plan { background: #04173a; color: #ffffff; }
    .fc-top, .fc-bottom { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .fc-brand { font-family: "Archivo", var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 7.5cqi; letter-spacing: -.02em; line-height: 1; }
    .fc-brand span { color: #fd5200; }
    .fc-plan { font-size: 4.2cqi; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: .5em .9em; border-radius: 999px; background: rgba(255, 255, 255, .12); }
    .fc-chip { position: relative; z-index: 1; width: 14%; aspect-ratio: 1.3; border-radius: 1.8cqi; background: linear-gradient(135deg, #e2e7ef, #a9b4c6); }
    .fc-bottom small { display: block; font-size: 3.6cqi; opacity: .7; letter-spacing: .06em; text-transform: uppercase; }
    .fc-bottom b { display: block; font-size: 5cqi; font-weight: 600; }
    .fc-num { font-size: 4.6cqi; letter-spacing: .14em; font-variant-numeric: tabular-nums; opacity: .9; margin-right: 34%; }

    /* Faixa */
    .ribbon-wrap { padding: 16px 0 24px; overflow: hidden; }
    .ribbon { background: var(--ribbon-bg); color: var(--ribbon-fg); padding: 16px 0; transform: rotate(-1.2deg); margin: 0 -8px; overflow: hidden; }
    .ribbon-track { display: flex; width: max-content; animation: marquee 40s linear infinite; }
    .ribbon-track span { font-family: var(--font-display); font-size: clamp(22px, 3.4cqi, 32px); font-weight: var(--h3-weight); font-stretch: var(--h2-stretch); padding: 0 20px; display: inline-flex; align-items: center; gap: 40px; white-space: nowrap; }
    .ribbon-track span::after { content: var(--ribbon-glyph); color: var(--ribbon-glyph-color); font-weight: 800; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* Tipografia */
    .type-rows { margin-top: 24px; display: grid; border-top: 1px solid var(--border); }
    .type-row { display: grid; gap: 4px 24px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
    @container pane (min-width: 700px) { .type-row { grid-template-columns: 170px 1fr; } }
    .type-row .spec { font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--fg-muted); }
    .type-row .spec b { display: block; color: var(--fg); font-family: var(--font-body); font-size: 13px; }
    .t-hero { font-family: var(--font-display); font-size: var(--hero-size); font-weight: var(--hero-weight); font-stretch: var(--hero-stretch); letter-spacing: var(--hero-track); line-height: var(--hero-lh); }
    .t-display { font-family: var(--font-display); font-size: var(--h2-size); font-weight: var(--h2-weight); font-stretch: var(--h2-stretch); letter-spacing: var(--h2-track); line-height: 1.04; }
    .t-lead { font-size: var(--lead-size); color: var(--fg-soft); }
    .t-small { font-size: 14px; color: var(--fg-soft); }
    .t-control { font-size: 16px; font-weight: var(--btn-weight); }
    .t-nav { font-size: 15px; font-weight: var(--nav-weight); }
    .t-caption { font-size: 13px; font-weight: 500; color: var(--fg-muted); }
    .t-num { font-family: var(--font-display); font-size: var(--big-num); font-weight: var(--num-weight); font-stretch: var(--num-stretch); letter-spacing: -.03em; line-height: 1; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
    .t-num small { font-family: var(--font-body); font-size: 22px; font-weight: 600; letter-spacing: 0; color: var(--fg-soft); margin-right: 6px; }
    .t-num.dark { color: var(--fg); }

    /* Botões — matriz */
    .btn-matrix { margin-top: 24px; display: grid; gap: 12px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .btn-row > span { width: 96px; font: 12px ui-monospace, Consolas, monospace; color: var(--fg-muted); }
    .on-dark-tile { margin-top: 12px; padding: 20px; border-radius: var(--r-card); background: var(--inverse); color: var(--inverse-fg); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .on-dark-tile .btn.secondary { background: transparent; color: var(--inverse-fg); border-color: #7a879e; box-shadow: none; }

    /* Paleta e superfícies */
    .swatches { margin-top: 24px; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .sw { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); font-size: 12px; }
    .sw i { display: block; height: 44px; border-bottom: 1px solid var(--border); }
    .sw div { padding: 6px 8px; } .sw b { display: block; font-size: 12px; } .sw code { color: var(--fg-muted); font-size: 11px; }
    .scale { margin-top: 16px; display: grid; gap: 6px; }
    .scale-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .scale-row i { display: grid; align-content: end; height: 64px; padding: 4px 6px; font: 10px/1.2 ui-monospace, Consolas, monospace; font-style: normal; }
    .scale-empty { margin-top: 16px; padding: 14px 16px; border: 1.5px dashed var(--border-strong); border-radius: 10px; color: var(--fg-soft); font-size: 14px; }
    .surfaces { margin-top: 24px; padding: 20px; border-radius: var(--r-card); background: var(--bg); border: 1px solid var(--border); display: grid; gap: 14px; }
    .surfaces .lbl { font: 11px ui-monospace, Consolas, monospace; color: var(--fg-muted); }
    .surf-band { padding: 18px; border-radius: var(--r-card); background: var(--band-bg); display: grid; gap: 12px; }
    @container pane (min-width: 640px) { .surf-band { grid-template-columns: 1fr 1fr; } }
    .surf-card { padding: 16px; border-radius: var(--r-card); background: var(--card-bg); border: 1px solid var(--border); }
    .surf-card.raised { box-shadow: var(--sh-card); }
    .surf-inverse { padding: 18px; border-radius: var(--r-card); background: var(--inverse); color: var(--inverse-fg); }
    .surf-inverse .lbl { color: var(--inverse-muted); }

    /* Sobre */
    .values { display: grid; gap: 16px; margin-top: 28px; }
    @container pane (min-width: 640px) { .values { grid-template-columns: repeat(2, 1fr); } }
    @container pane (min-width: 1000px) { .values { grid-template-columns: repeat(4, 1fr); } }
    .value { padding: 24px; border-radius: var(--r-card); background: var(--value-bg); border: 1px solid var(--border); }
    .value .dot-tile { width: 48px; height: 48px; }
    .value .h3 { margin-top: 16px; font-size: 19px; }
    .value p { margin-top: 8px; color: var(--fg-soft); font-size: 15px; }

    /* Catálogo */
    .band { background: var(--band-bg); border-top: 1px solid var(--band-border); border-bottom: 1px solid var(--band-border); }
    .controls { margin-top: 28px; display: grid; gap: 20px; }
    .field { display: grid; gap: 6px; }
    .field label, .field .label { font-weight: 600; font-size: 15px; }
    .hint { font-size: 14px; color: var(--fg-muted); display: flex; gap: 6px; align-items: flex-start; }
    .select-wrap { position: relative; max-width: 420px; }
    .select-wrap select { appearance: none; width: 100%; min-height: 52px; padding: 0 48px 0 16px; border-radius: var(--r-control); border: 1.5px solid var(--control-border); background: var(--control-bg); font-weight: 500; font-size: 16px; color: var(--fg); cursor: pointer; box-shadow: var(--sh-soft); }
    .select-wrap select:hover { border-color: var(--fg-muted); }
    .select-wrap select:disabled { background: var(--surface-muted); color: var(--fg-muted); border-color: var(--border); cursor: not-allowed; box-shadow: none; }
    .select-wrap .icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--fg-soft); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-chip); border: 1.5px solid var(--chip-border); background: var(--chip-bg); color: var(--fg); font-weight: 500; font-size: 15px; cursor: pointer; transition: background-color .12s, border-color .12s; }
    .chip:hover { border-color: var(--fg-muted); }
    .theme-current .chip:hover { border-color: var(--accent-fg); }
    .chip[aria-pressed="true"] { background: var(--chip-sel-bg); color: var(--chip-sel-fg); border-color: var(--chip-sel-border); }
    .chip[aria-pressed="true"] .icon { width: 14px; height: 14px; stroke-width: 3; }
    .chip:disabled { cursor: not-allowed; color: var(--fg-muted); border-style: dashed; }
    .theme-current .chip:disabled { opacity: .5; border-style: solid; }
    .results { margin-top: 24px; font-size: 15px; color: var(--fg-muted); }
    .grid { margin-top: 14px; display: grid; gap: 16px; }
    @container pane (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @container pane (min-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
    .card { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: var(--r-card); background: var(--card-bg); border: 1px solid var(--border); transition: border-color .12s, box-shadow .2s cubic-bezier(.2,.7,.2,1), transform .2s cubic-bezier(.2,.7,.2,1); overflow: hidden; }
    .card:hover { border-color: var(--border-strong); box-shadow: var(--sh-card); transform: translateY(-2px); }
    .card.featured { border-color: var(--featured-border); box-shadow: var(--featured-ring); }
    .card.featured::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--featured-bar); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: var(--tag-bg); color: var(--fg-soft); font-size: 13px; font-weight: 500; }
    .tag.featured { background: var(--tag-featured-bg); color: var(--tag-featured-fg); }
    .tag.has-coupon { background: var(--accent-soft); color: var(--accent-fg); }
    .tag .icon { width: 13px; height: 13px; }
    .card .h3 a { text-decoration: none; color: var(--fg); }
    .card .h3 a::after { content: ""; position: absolute; inset: 0; }
    .loc { display: flex; align-items: center; gap: 6px; color: var(--fg-muted); font-size: 14px; }
    .card-bottom { margin-top: auto; padding-top: 16px; border-top: 1px dashed var(--border-strong); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .pane:not(.theme-current) .card-bottom { border-top-style: solid; border-top-color: var(--border); }
    .pct small { display: block; font-size: 13px; color: var(--fg-muted); }
    .pct strong { font-family: var(--font-display); font-size: var(--num-size); font-weight: var(--num-weight); font-stretch: var(--num-stretch); letter-spacing: -.03em; line-height: 1; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
    .pct strong span { font-family: var(--font-body); font-size: 17px; font-weight: 600; letter-spacing: 0; margin-right: 4px; color: var(--fg-soft); }

    /* Passos */
    .steps { display: grid; gap: 16px; margin-top: 28px; }

        scales: [["neutro quente", [["canvas","#ffffff"],["band","#fff6f0"],["border","#ede3db"],["strong","#dccfc4"],["control","#8c7f76"],["muted","#5f5650"],["soft","#3d3835"],["navy","#04173a"]]], ["orange", ORANGE]],
        spec: { hero: "clamp(38–72px) / 1.04 · 800 · -0.03em", display: "clamp(30–48px) · 800 · -0.025em", heading: "21px · 700", lead: "18px · 400", body: "16px · 400", small: "14px · 400", nav: "15px · 600", control: "16px · 700", caption: "13px · 500", eyebrow: "13px · 700 · +0.1em", num: "38–68px · 800 · tnum" },

    const SWATCHES = [["background","--bg"],["surface","--surface"],["surface-muted","--surface-muted"],["navy-surface","--inverse"],["foreground","--fg"],["foreground-soft","--fg-soft"],["muted-foreground","--fg-muted"],["border","--border"],["border-strong","--border-strong"],["control-border","--control-border"],["primary","--primary"],["primary-hover","--primary-hover"],["primary-active","--primary-active"],["primary-foreground","--primary-fg"],["accent-foreground","--accent-fg"],["accent-strong","--accent-strong"],["accent-soft","--accent-soft"],["brand-signal","--signal"],["focus","--focus"],["focus-on-dark","--focus-dark"],["selection","--sel-bg"],["scrollbar-thumb","--sb-thumb"]];
    const PAIRS = [
      ["foreground / background","--fg","--bg",4.5],["foreground / surface","--fg","--surface",4.5],["foreground-soft / background","--fg-soft","--bg",4.5],

      ["primary-foreground / primary","--primary-fg","--primary",4.5],["primary-foreground / primary-hover","--primary-fg","--primary-hover",4.5],["primary-foreground / primary-active","--primary-fg","--primary-active",4.5],
      ["primary / background (forma)","--primary","--bg",3],["accent-strong / surface (≥24px)","--accent-strong","--surface",3],["accent-foreground / background","--accent-fg","--bg",4.5],["accent-foreground / accent-soft","--accent-fg","--accent-soft",4.5],
      ["sidebar-foreground / sidebar","--inverse-fg","--inverse",4.5],["sidebar-muted / sidebar","--inverse-muted","--inverse",4.5],
      ["focus / background","--focus","--bg",3],["focus / surface","--focus","--surface",3],["focus / surface-muted","--focus","--surface-muted",3],["focus-on-dark / sidebar","--focus-dark","--inverse",3],
      ["control-border / campo branco","--control-border","--surface",3],["control-border / banda","--control-border","--band-bg",3],["border / background","--border","--bg",0],
      ["selection: texto / fundo","--sel-fg","--sel-bg",4.5],["scrollbar thumb / track","--sb-thumb","--sb-track",3],
    ];

    const lum = (hex) => { const v = hex.replace("#", ""); return [0, 2, 4].map(i => parseInt(v.substr(i, 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4).reduce((s, c, i) => s + c * [.2126, .7152, .0722][i], 0); };
    const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
    const isHex = (s) => /^#[0-9a-f]{6}$/i.test(s);
    const fmt = (n) => n.toFixed(2).replace(".", ",");

    const tpl = document.getElementById("page");
    const fcTpl = document.getElementById("flexcard");
    const panes = [...document.querySelectorAll("[data-pane]")];
    const heads = [...document.querySelectorAll("[data-head]")];

    function render(i, key) {
      const pane = panes[i], t = THEMES[key];

      const sm = document.createElement("small"); sm.textContent = t.sub; heads[i].append(sm);
      pane.querySelector("[data-font-name]").textContent = t.font;
      pane.querySelectorAll("[data-spec]").forEach(el => { const k = el.dataset.spec; el.innerHTML = `<b>${k}</b>${t.spec[k]}`; });
      const cs = getComputedStyle(pane), v = (n) => cs.getPropertyValue(n).trim();
      // escalas
      const sc = pane.querySelector("[data-scales]");
      if (!t.scales) { sc.innerHTML = `<div class="scale-empty"><b>Sem escala.</b> Valores avulsos: primary #cc4a0a · primary-hover #b83f08 · primary-edge #92350a · accent #f4651a · accent-foreground #b23f07 · gradient-to #f68d36 · foreground #0a1428 · sidebar #071024 · background #f5f7f8 · surface-muted #f1f3f5 · border #cbd3dc · control-border #c4ccd5.</div>`; }
      else {
        const wrap = document.createElement("div"); wrap.className = "scale";
        for (const [label, steps] of t.scales) {
          const row = document.createElement("div"); row.className = "scale-row"; row.setAttribute("aria-label", label);
          for (const [n, hex] of steps) { const i2 = document.createElement("i"); i2.style.background = hex; i2.style.color = lum(hex) > .3 ? "#04173a" : "#ffffff"; i2.innerHTML = `${label === "navy" || label === "orange" ? label + "-" : ""}${n}<br>${hex}`; row.append(i2); }
          wrap.append(row);
        }
        sc.append(wrap);
      }
      // swatches
      const sw = pane.querySelector("[data-swatches]");
      for (const [label, name] of SWATCHES) { const val = v(name); const d = document.createElement("div"); d.className = "sw"; d.innerHTML = `<i style="background:${val}"></i><div><b>${label}</b><code>${isHex(val) ? val : "padrão do browser"}</code></div>`; sw.append(d); }
      // seleção
      pane.querySelector("[data-sel-info]").textContent = isHex(v("--sel-bg")) ? `fundo ${v("--sel-bg")} · texto ${v("--sel-fg")} · ${fmt(ratio(v("--sel-fg"), v("--sel-bg")))}:1` : "Padrão do sistema operacional (Highlight / HighlightText).";
      // contraste
      const tb = pane.querySelector("[data-contrast]");
      tb.innerHTML = "<thead><tr><th>Par</th><th>Valores</th><th>Razão</th><th>Mínimo</th><th></th></tr></thead>";
      const body = document.createElement("tbody");
      for (const [label, a, b, min] of PAIRS) {
        const fa = v(a), fb = v(b), tr = document.createElement("tr");
        if (!isHex(fa) || !isHex(fb)) { tr.innerHTML = `<td>${label}</td><td colspan="4" class="muted">padrão do browser — não controlado</td>`; body.append(tr); continue; }
        const r = ratio(fa, fb), pass = min === 0 ? null : r >= min;
        tr.innerHTML = `<td>${label}</td><td><span class="chipc" style="background:${fb};color:${fa}">Aa</span>${fa} / ${fb}</td><td>${fmt(r)}:1</td><td>${min ? fmt(min) + ":1" : "decorativa"}</td><td>${pass === null ? "—" : pass ? '<span class="ok">✓ passa</span>' : '<span class="fail">✕ falha</span>'}</td>`;
        body.append(tr);
      }
      tb.append(body);
    }

    const stage = document.getElementById("stage");
    function setMode(m) {
      stage.classList.toggle("single", m === "single");
      document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
      document.querySelectorAll("[data-right-ctrl]").forEach(el => el.style.visibility = m === "single" ? "hidden" : "");
    }
    document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
    selL.addEventListener("change", () => { render(0, selL.value); syncUrl(); });
    selR.addEventListener("change", () => { render(1, selR.value); syncUrl(); });
    function syncUrl() { history.replaceState(null, "", `#${selL.value}-${selR.value}`); }

    // rolagem sincronizada por proporção
    const sync = document.getElementById("sync"); let lock = false;
    panes.forEach((p, i) => p.addEventListener("scroll", () => {
      if (!sync.checked || lock || stage.classList.contains("single")) return;
      const o = panes[1 - i]; lock = true;
      o.scrollTop = p.scrollTop / Math.max(1, p.scrollHeight - p.clientHeight) * (o.scrollHeight - o.clientHeight);
      requestAnimationFrame(() => lock = false);
    }));

    const jump = document.getElementById("jump");
    function goTo(n) { panes.forEach(p => { const el = p.querySelectorAll(".sec-label")[n]; if (el) p.scrollTop = el.offsetTop - p.offsetTop - 70; }); }
    jump.addEventListener("change", () => { lock = true; goTo(+jump.value); requestAnimationFrame(() => lock = false); });
    const [l, r, sec] = (location.hash.slice(1) || "current-a").split("-");
    selL.value = THEMES[l] ? l : "current"; selR.value = THEMES[r] ? r : "a";
    render(0, selL.value); render(1, selR.value);
    panes[0].querySelectorAll(".sec-label").forEach((el, n) => jump.append(new Option(el.textContent.split(" (")[0], n)));
    if (sec) { jump.value = sec; requestAnimationFrame(() => goTo(+sec)); }
  </script>
</body>
</html>
